<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Analiza Działki — GIS</title>

<!-- PWA: umożliwia dodanie do ekranu głównego i otwieranie bez belki przeglądarki -->
<link rel="manifest" href="/static/manifest.json" />
<meta name="theme-color" content="#0f5c4f" />
<meta name="background-color" content="#f4f7f5" />

<!-- iOS: zachowanie jak natywna appka po "Dodaj do ekranu głównego" -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Analiza Działki" />
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />

<!-- Android/Chrome -->
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="64x64" href="/static/icons/favicon.png" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --ink:#1b2b28;
    --paper:#f4f7f5;
    --line:#c7d3cd;
    --survey:#0f5c4f;   /* deep surveyor teal — signature color */
    --survey-dim:#0f5c4f22;
    --danger:#a3231f;
    --danger-bg:#fbe9e8;
    --ok:#1f6b3b;
    --ok-bg:#e9f5ec;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, system-ui, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);}

  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  /* ---------- MAP (40%) ---------- */
  #map-wrap{
    position:relative;
    height:40vh;
    height:40dvh;
    flex:0 0 auto;
    border-bottom:3px solid var(--survey);
  }
  #map{ width:100%; height:100%; }

  #map-badge{
    position:absolute;
    top:10px; left:10px;
    z-index:500;
    background:var(--ink);
    color:#fff;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.04em;
    padding:5px 9px;
    border-radius:3px;
    opacity:.9;
    pointer-events:none;
  }

  /* ---------- PANEL (60%) ---------- */
  #panel{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px 16px 28px;
    -webkit-overflow-scrolling:touch;
  }

  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--survey);
    margin:0 0 6px;
  }

  .input-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:4px 4px 4px 14px;
    margin-bottom:10px;
  }
  .input-row:focus-within{ border-color:var(--survey); }

  #parcelInput{
    flex:1;
    border:none;
    outline:none;
    font-family:var(--mono);
    font-size:16px;
    padding:12px 4px;
    background:transparent;
    color:var(--ink);
    min-width:0;
  }
  #parcelInput::placeholder{ color:#8a9a95; }

  #clearBtn{
    border:none;
    background:transparent;
    color:#8a9a95;
    font-size:18px;
    width:34px;
    height:34px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  #clearBtn:active{ background:#eef2f0; }

  #checkBtn{
    width:100%;
    border:none;
    background:var(--survey);
    color:#fff;
    font-family:var(--sans);
    font-weight:600;
    font-size:16px;
    padding:15px 0;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:18px;
    transition:opacity .15s;
  }
  #checkBtn:disabled{ opacity:.65; }
  #checkBtn:active:not(:disabled){ opacity:.85; }

  .spinner{
    width:16px; height:16px;
    border:2.5px solid rgba(255,255,255,.35);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
  }
  .spinner.on{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- RESULT CARDS ---------- */
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-left:4px solid var(--survey);
    border-radius:8px;
    padding:14px 14px;
    margin-bottom:10px;
  }
  .card h3{
    margin:0 0 6px;
    font-size:13px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:#5b6d67;
    font-weight:700;
  }
  .card p{ margin:0; font-size:15px; line-height:1.45; }
  .card.muted p{ color:#5b6d67; font-size:14px; }

  .card.danger{ background:var(--danger-bg); border-left-color:var(--danger); }
  .card.danger h3{ color:var(--danger); }
  .card.danger p{ color:var(--danger); font-weight:700; font-size:16px; }

  .card.ok{ background:var(--ok-bg); border-left-color:var(--ok); }
  .card.ok h3{ color:var(--ok); }
  .card.ok p{ color:var(--ok); font-weight:700; font-size:16px; }

  .value-card{
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:18px 16px;
  }
  .value-card .eyebrow{ color:#8fd0bd; }
  .value-card .amount{
    font-family:var(--mono);
    font-size:28px;
    font-weight:700;
    margin:2px 0 8px;
    word-break:break-word;
  }
  .value-card .breakdown{
    font-size:12.5px;
    color:#c4d3cd;
    line-height:1.5;
  }
  .disclaimer{
    font-size:11px;
    color:#8a9a95;
    line-height:1.5;
    margin-top:14px;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }

  #placeholder{
    text-align:center;
    color:#8a9a95;
    font-size:14px;
    padding:30px 10px;
    line-height:1.6;
  }

  #errorBox{
    display:none;
    background:var(--danger-bg);
    color:var(--danger);
    border-radius:8px;
    padding:12px 14px;
    font-size:14px;
    margin-bottom:12px;
  }

  .teryt-echo{
    font-family:var(--mono);
    font-size:12px;
    color:#5b6d67;
    margin:-4px 0 14px;
  }

  /* ---------- LEAFLET LAYER CONTROL ---------- */
  .leaflet-control-layers{
    border-radius:8px !important;
    font-family:var(--sans);
    font-size:12px;
    padding:6px 8px !important;
    max-width:150px;
  }
  .leaflet-control-layers-list label{
    display:flex;
    align-items:center;
    gap:5px;
    margin:3px 0;
    white-space:normal;
    line-height:1.25;
  }
  .leaflet-control-layers-toggle{
    width:34px !important;
    height:34px !important;
  }

  /* ---------- DATA TABLES ---------- */
  .data-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .data-table tr{ border-bottom:1px solid var(--line); }
  .data-table tr:last-child{ border-bottom:none; }
  .data-table td{ padding:6px 4px; vertical-align:top; }
  .data-table td.label{ color:#5b6d67; width:46%; padding-right:10px; }
  .data-table td.value{ font-weight:600; text-align:right; }

  /* ---------- UTILITY CHIP GRID (GESUT) ---------- */
  .chip-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:4px;
  }
  .chip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    padding:9px 11px;
    border-radius:10px;
    font-size:13.5px;
    border:1px solid var(--line);
    background:#fff;
    color:#5b6d67;
  }
  .chip.present{
    border-color:var(--ok);
    background:var(--ok-bg);
    color:var(--ok);
    font-weight:700;
  }
  .chip .dot{
    width:8px; height:8px; border-radius:50%;
    background:currentColor;
    flex:0 0 auto;
    opacity:.85;
  }

  /* ---------- BUILDING LIST ---------- */
  .building-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 11px;
    border-radius:10px;
    background:#f6f8f7;
    border:1px solid var(--line);
    margin-bottom:6px;
    font-size:14px;
  }
  .building-row .tag{
    font-size:11px;
    color:#5b6d67;
    display:block;
    margin-top:2px;
  }

  /* ---------- WATERWAY LIST ---------- */
  .waterway-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:7px 0;
    font-size:14px;
    border-bottom:1px solid var(--line);
  }
  .waterway-row:last-child{ border-bottom:none; }
  .waterway-row .kind{ color:#5b6d67; font-size:12.5px; }

  /* ---------- LINK-OUT BUTTON (GUNB) ---------- */
  .link-out-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    padding:11px 16px;
    border-radius:10px;
    background:var(--ink);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
  }

  /* ---------- SPLIT VALUE CARDS ---------- */
  .value-card.secondary{
    background:#eef2f0;
    color:var(--ink);
  }
  .value-card.secondary .eyebrow{ color:var(--survey); }
  .value-card.secondary .amount{ color:var(--ink); }
  .value-card.secondary .breakdown{ color:#5b6d67; }
</style>
</head>
<body>
<div id="app">

  <div id="map-wrap">
    <div id="map-badge">EWIDENCJA GRUNTÓW · PODGLĄD</div>
    <div id="map"></div>
  </div>

  <div id="panel">
    <p class="eyebrow">Analiza działki</p>

    <div class="input-row">
      <input id="parcelInput" type="text" inputmode="text" autocomplete="off"
             placeholder="np. 141201_1.0001.6509" />
      <button id="clearBtn" aria-label="Wyczyść">✕</button>
    </div>

    <button id="checkBtn">
      <span id="btnLabel">Sprawdź działkę</span>
      <span class="spinner" id="spinner"></span>
    </button>

    <div id="errorBox"></div>
    <div id="results">
      <div id="placeholder">
        Wpisz identyfikator TERYT działki (lub "obręb numer"),<br/>
        aby zobaczyć ewidencję gruntów i budynków, zagrożenia<br/>
        osuwiskowe, media, hydrologię, plany zagospodarowania,<br/>
        pozwolenia na budowę oraz szacunkową wartość gruntu i budynków.
      </div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
